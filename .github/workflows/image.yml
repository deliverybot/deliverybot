name: Image

# Builds the image for every push to master and tags it with the commit SHA.
# The Deploy workflow calls this too, and then reuses the image if it exists.
# Nothing runs until the repository variable DEPLOY_ENABLED is set to "true".
on:
  push:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: Commit SHA, tag or branch to build (defaults to the triggering commit)
        type: string
        required: false
    outputs:
      sha:
        description: The commit SHA the image is tagged with
        value: ${{ jobs.image.outputs.sha }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    if: github.repository == 'deliverybot/deliverybot' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.sha.outputs.sha }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.sha.outputs.sha }}
          build-args: COMMIT_SHA=${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
