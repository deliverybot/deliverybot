name: Deploy

# Deliverybot deploys itself. Every push to master builds an image. Deliverybot
# (configured in .github/deploy.yml) creates a GitHub deployment for staging
# once CI and the image are green, and for production when someone deploys it
# from the dashboard. The `deployment` event runs the deploy job below, which
# reports back through deployment statuses.
#
# Break glass: if a deploy breaks Deliverybot itself, it can no longer create
# deployments. Run this workflow by hand from the Actions tab instead ("Run
# workflow", pick the environment, optionally a commit to roll back to). It
# needs nothing from the app and still records a deployment, so the history
# stays complete.
#
# Nothing runs until the repository variable DEPLOY_ENABLED is set to "true"
# (see deploy/kubernetes/README.md).
on:
  push:
    branches: [master]
  deployment:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Commit SHA, tag or branch to deploy (defaults to the branch above)
        type: string
        required: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    if: github.repository == 'deliverybot/deliverybot' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Deployments and rollbacks usually reuse the image the push built.
      - id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.sha.outputs.sha }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # The deployment is created by Deliverybot (or by the break-glass step
    # below), so Actions must not create a second one for the environment.
    environment:
      name: ${{ github.event.deployment.environment || inputs.environment }}
      deployment: false
    concurrency:
      group: deploy-${{ github.event.deployment.environment || inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    env:
      ENVIRONMENT: ${{ github.event.deployment.environment || inputs.environment }}
      SHA: ${{ needs.image.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.image.outputs.sha }}

      - name: Look up the environment URL
        run: |
          case "$ENVIRONMENT" in
            staging) url=https://staging.deliverybot.dev ;;
            production) url=https://app.deliverybot.dev ;;
            *) echo "::error::Unknown environment $ENVIRONMENT"; exit 1 ;;
          esac
          echo "ENVIRONMENT_URL=$url" >> "$GITHUB_ENV"

      - name: Record a break-glass deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        # Deployments created with GITHUB_TOKEN don't trigger workflows, so
        # this doesn't start a second run.
        run: |
          id=$(jq -n \
            --arg ref "$SHA" \
            --arg environment "$ENVIRONMENT" \
            --arg description "Break-glass deploy by $GITHUB_ACTOR" \
            '{ref: $ref, environment: $environment, description: $description,
              task: "deploy", auto_merge: false, required_contexts: [],
              production_environment: ($environment == "production"),
              payload: {break_glass: true}}' |
            gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          echo "DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"

      - name: Use the triggering deployment
        if: github.event_name == 'deployment'
        run: echo "DEPLOYMENT_ID=${{ github.event.deployment.id }}" >> "$GITHUB_ENV"

      - uses: deliverybot/deployment-status@v2
        with:
          state: in_progress
          deployment-id: ${{ env.DEPLOYMENT_ID }}
          environment-url: ${{ env.ENVIRONMENT_URL }}

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Connect to the cluster
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 900 "${{ vars.DO_CLUSTER }}"

      - name: Update the app secret
        env:
          APP_ID: ${{ secrets.APP_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        run: |
          set -o pipefail
          overlay=deploy/kubernetes/overlays/$ENVIRONMENT
          namespace=$(yq ".metadata.name" "$overlay/namespace.yaml")
          kubectl apply -f "$overlay/namespace.yaml"
          kubectl -n "$namespace" create secret generic deliverybot \
            --from-literal=APP_ID="$APP_ID" \
            --from-literal=PRIVATE_KEY="$PRIVATE_KEY" \
            --from-literal=WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --from-literal=SESSION_SECRET="$SESSION_SECRET" \
            --from-literal=CLIENT_ID="$CLIENT_ID" \
            --from-literal=CLIENT_SECRET="$CLIENT_SECRET" \
            --from-literal=SLACK_CLIENT_ID="$SLACK_CLIENT_ID" \
            --from-literal=SLACK_CLIENT_SECRET="$SLACK_CLIENT_SECRET" \
            --from-literal=SLACK_SIGNING_SECRET="$SLACK_SIGNING_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f - | tee "$RUNNER_TEMP/secret.log"
          echo "NAMESPACE=$namespace" >> "$GITHUB_ENV"
          # Pods read the secret only at start, so a changed secret needs a
          # restart even when the image stays the same.
          if ! grep -q unchanged "$RUNNER_TEMP/secret.log"; then
            echo "SECRET_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Apply the manifests
        run: |
          set -o pipefail
          mkdir -p deploy/kubernetes/release
          cat > deploy/kubernetes/release/kustomization.yaml <<YAML
          resources:
            - ../overlays/$ENVIRONMENT
          images:
            - name: deliverybot
              newName: $IMAGE
              newTag: $SHA
          YAML
          kubectl apply -k deploy/kubernetes/release | tee "$RUNNER_TEMP/apply.log"
          if [ "$SECRET_CHANGED" = true ]; then
            for deployment in web worker; do
              if grep -q "deployment.apps/$deployment unchanged" "$RUNNER_TEMP/apply.log"; then
                kubectl -n "$NAMESPACE" rollout restart "deployment/$deployment"
              fi
            done
          fi
          for deployment in web worker; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$deployment" --timeout=5m
          done

      - if: success()
        uses: deliverybot/deployment-status@v2
        with:
          state: success
          deployment-id: ${{ env.DEPLOYMENT_ID }}
          environment-url: ${{ env.ENVIRONMENT_URL }}

      - if: failure() && env.DEPLOYMENT_ID != ''
        uses: deliverybot/deployment-status@v2
        with:
          state: failure
          deployment-id: ${{ env.DEPLOYMENT_ID }}

      - if: cancelled() && env.DEPLOYMENT_ID != ''
        uses: deliverybot/deployment-status@v2
        with:
          state: error
          deployment-id: ${{ env.DEPLOYMENT_ID }}
          description: Deploy cancelled

  # If the image job fails or is skipped, the deploy job never starts, so the
  # deployment Deliverybot created would stay pending.
  image-failed:
    needs: image
    if: failure() && github.event_name == 'deployment'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - uses: deliverybot/deployment-status@v2
        with:
          state: failure
          description: Building the image failed
