name: Deploy

# Every push to master goes to staging. Production is deployed by hand from
# the Actions tab ("Run workflow", environment: production). Nothing runs
# until the repository variable DEPLOY_ENABLED is set to "true", so merges
# don't fail before the cluster is set up (see deploy/kubernetes/README.md).
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [staging, production]
        default: staging

env:
  IMAGE: ghcr.io/${{ github.repository }}
  ENVIRONMENT: ${{ inputs.environment || 'staging' }}

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'deliverybot/deliverybot' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Connect to the cluster
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 900 "${{ vars.DO_CLUSTER }}"

      - name: Update the app secret
        env:
          APP_ID: ${{ secrets.APP_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_LOGIN_URL: ${{ secrets.SLACK_LOGIN_URL }}
        run: |
          overlay=deploy/kubernetes/overlays/$ENVIRONMENT
          namespace=$(yq ".metadata.name" "$overlay/namespace.yaml")
          kubectl apply -f "$overlay/namespace.yaml"
          kubectl -n "$namespace" create secret generic deliverybot \
            --from-literal=APP_ID="$APP_ID" \
            --from-literal=PRIVATE_KEY="$PRIVATE_KEY" \
            --from-literal=WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --from-literal=SESSION_SECRET="$SESSION_SECRET" \
            --from-literal=CLIENT_ID="$CLIENT_ID" \
            --from-literal=CLIENT_SECRET="$CLIENT_SECRET" \
            --from-literal=SLACK_CLIENT_ID="$SLACK_CLIENT_ID" \
            --from-literal=SLACK_CLIENT_SECRET="$SLACK_CLIENT_SECRET" \
            --from-literal=SLACK_LOGIN_URL="$SLACK_LOGIN_URL" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "NAMESPACE=$namespace" >> "$GITHUB_ENV"

      - name: Apply the manifests
        run: |
          mkdir -p deploy/kubernetes/release
          cat > deploy/kubernetes/release/kustomization.yaml <<YAML
          resources:
            - ../overlays/$ENVIRONMENT
          images:
            - name: deliverybot
              newName: $IMAGE
              newTag: $GITHUB_SHA
          YAML
          kubectl apply -k deploy/kubernetes/release
          for deployment in web worker; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$deployment" --timeout=5m
          done
