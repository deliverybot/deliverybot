# GitHub App manifest for running your own Deliverybot. Use it to register an
# app (https://docs.github.com/en/apps/sharing-github-apps/registering-a-github-app-from-a-manifest)
# after replacing https://deliverybot.example.com with your BASE_URL.
# Changing this file doesn't update an existing app; edit its settings on
# GitHub to match.

name: deliverybot
url: https://deliverybot.dev
description: Controls and configures deployments using the GitHub API.
# Only installable by the account that owns the app.
public: false

hook_attributes:
  # BASE_URL + WEBHOOK_PATH (default /api/github/webhooks).
  url: https://deliverybot.example.com/api/github/webhooks
# Sign in to the dashboard with GitHub.
callback_urls:
  - https://deliverybot.example.com/login/cb

default_events:
  - check_run # finished checks trigger waiting auto deploys
  - deployment
  - deployment_status
  - issue_comment # /deploy commands
  - pull_request
  - push
  - status # finished commit statuses trigger waiting auto deploys

default_permissions:
  checks: read
  # Reads .github/deploy.yml and commits.
  contents: read
  deployments: write
  # Replies and reactions to /deploy comments.
  issues: write
  metadata: read
  # Also needed for replies and reactions on pull requests: GitHub refuses
  # them with only issues: write when a repository has issues turned off.
  pull_requests: write
  # Commit statuses for deployments.
  statuses: write
