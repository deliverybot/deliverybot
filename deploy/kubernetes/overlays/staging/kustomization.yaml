apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deliverybot-staging
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: deliverybot
    behavior: merge
    literals:
      - BASE_URL=https://staging.deliverybot.dev
patches:
  - target:
      kind: HTTPRoute
      name: web
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: staging.deliverybot.dev
  # CloudNativePG's disruption budget keeps a single-instance database from
  # being evicted at all, which blocks draining its node during cluster
  # upgrades. Staging can take the short outage while the pod moves.
  - target:
      kind: Cluster
      name: deliverybot-db
    patch: |
      - op: add
        path: /spec/enablePDB
        value: false
