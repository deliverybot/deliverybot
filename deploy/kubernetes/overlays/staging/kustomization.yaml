apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deliverybot-staging
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: deliverybot
    behavior: merge
    literals:
      - BASE_URL=https://staging.deliverybot.dev
patches:
  - target:
      kind: Ingress
      name: web
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.deliverybot.dev
      - op: replace
        path: /spec/rules/0/host
        value: staging.deliverybot.dev
