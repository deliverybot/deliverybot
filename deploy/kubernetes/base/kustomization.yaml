apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: deliverybot
resources:
  - database.yaml
  - backup.yaml
  - web.yaml
  - worker.yaml
  - route.yaml
configMapGenerator:
  - name: deliverybot
    literals:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - LOG_LEVEL=info
