apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Prefer putting web pods on different nodes, so losing one node leaves
      # the others serving. Only the current ReplicaSet counts, so a rollout
      # isn't skewed by the pods it is replacing.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
          matchLabelKeys:
            - pod-template-hash
      # Migrations take a Postgres advisory lock, so every pod can run them
      # safely before it starts.
      initContainers:
        - name: migrate
          image: deliverybot
          command: ["node", "packages/postgres/lib/cli.js"]
          envFrom:
            - configMapRef:
                name: deliverybot
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deliverybot-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      containers:
        - name: web
          image: deliverybot
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: deliverybot
            - secretRef:
                name: deliverybot
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deliverybot-db-app
                  key: uri
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
---
# Node drains (cluster upgrades) evict web pods one at a time, waiting for a
# replacement to be ready before taking the next. With a single pod, as in
# staging, the drain still goes ahead.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  maxUnavailable: 1
  # A pod that isn't ready isn't serving, so don't let it hold up a drain.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: web
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
