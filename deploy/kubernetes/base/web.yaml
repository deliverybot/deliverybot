apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Migrations take a Postgres advisory lock, so every pod can run them
      # safely before it starts.
      initContainers:
        - name: migrate
          image: deliverybot
          command: ["node", "packages/postgres/lib/cli.js"]
          envFrom:
            - configMapRef:
                name: deliverybot
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deliverybot-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      containers:
        - name: web
          image: deliverybot
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: deliverybot
            - secretRef:
                name: deliverybot
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deliverybot-db-app
                  key: uri
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
