# Postgres through the CloudNativePG operator. It creates the `deliverybot`
# database and a `deliverybot-db-app` secret whose `uri` key is the
# connection string the app uses.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: deliverybot-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  # WAL archiving and base backups to the `postgres-backups` ObjectStore,
  # see backup.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backups
  bootstrap:
    initdb:
      database: deliverybot
      owner: deliverybot
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
