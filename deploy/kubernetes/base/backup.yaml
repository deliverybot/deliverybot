# Nightly base backup through the Barman Cloud plugin for CloudNativePG. With
# WAL archiving (enabled in database.yaml) the database can be restored to any
# point within the retention window. The `postgres-backups` ObjectStore that
# says where backups go and how long they're kept must exist in the namespace;
# it isn't part of these manifests.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: deliverybot-db-nightly
spec:
  # Seconds first: every day at 03:00 UTC.
  schedule: "0 0 3 * * *"
  # Also back up right away, so a new cluster has a base backup to restore
  # from before the first night.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: deliverybot-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
