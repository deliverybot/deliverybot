<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Error</title>
    <link rel="icon" href="/static/logo.png">
    <style>
      /* Self-contained so the page renders even when the app's assets don't. */
      :root { color-scheme: light dark; --bg: #f6f8fa; --box: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --link: #0969da; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #151b23; --box: #0d1117; --fg: #f0f6fc; --muted: #9198a1; --border: #3d444d; --link: #4493f8; }
      }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; text-align: center; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      img { margin-bottom: 40px; }
      .box { max-width: 100%; box-sizing: border-box; padding: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--box); box-shadow: 0 1px 3px rgba(31, 35, 40, 0.12); }
      h1 { margin: 0 0 8px; font-size: 32px; font-weight: 400; }
      p { margin: 0 0 10px; }
      p:last-child { margin-bottom: 0; }
      a { color: var(--link); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <img src="https://deliverybot.dev/assets/logos/logo-bg.png" alt="Deliverybot logo" width="100">
    <div class="box">
      <h1>500</h1>
      <p>Something went wrong.</p>
    </div>
  </body>
</html>
